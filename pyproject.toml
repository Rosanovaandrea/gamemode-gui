[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gamemode-gui"
version = "1.0.0"
description = "GTK4/Libadwaita GUI for Feral GameMode"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["PyGObject>=3.42"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
gamemode-gui = "main:main"

[tool.setuptools]
py-modules = ["main", "core", "initializer", "spec", "configuration"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["data*", "i18n*", "sections*", "services*", "state*", "ui*"]

[tool.setuptools.package-data]
data = ["style.css", "locale/*.po", "locale/*.json", "locale/*/LC_MESSAGES/*.mo"]
