name: Build packages

# - Su push di un tag "vX.Y.Z": costruisce .deb e .rpm e li pubblica in una
#   Release di GitHub (sezione "Releases").
# - Manualmente (workflow_dispatch): costruisce e carica gli artifact, senza
#   creare la release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Un solo build per ref: evita release concorrenti su push ravvicinati.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build .deb and .rpm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          # dpkg-deb (dal pacchetto dpkg) per il .deb; rpm/rpmbuild per l'.rpm.
          sudo apt-get install -y dpkg-dev rpm

      - name: Build packages
        run: |
          # Se siamo su un tag, usa la versione dal tag (es. v1.2.3 -> 1.2.3).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash packaging/build.sh
          echo "--- file generati ---"
          ls -l dist/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Solo sui tag: crea/aggiorna la Release e allega i pacchetti.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
