name: Build packages

# - On pushing a "vX.Y.Z" tag: builds the .deb and the .rpm and publishes them in
#   a GitHub Release (the "Releases" section).
# - Manually (workflow_dispatch): builds and uploads the artifacts, without
#   creating a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# A single build per ref: avoids concurrent releases on closely spaced pushes.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build .deb and .rpm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          # dpkg-deb (from the dpkg package) for the .deb; rpm/rpmbuild for the .rpm.
          sudo apt-get install -y dpkg-dev rpm

      - name: Build packages
        run: |
          # If we are on a tag, use the version from the tag (e.g. v1.2.3 -> 1.2.3).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash packaging/build.sh
          echo "--- generated files ---"
          ls -l dist/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Only on tags: create/update the Release and attach the packages.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
